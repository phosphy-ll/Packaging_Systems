services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-packaging}
      POSTGRES_USER: ${POSTGRES_USER:-packaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-packaging} -d ${POSTGRES_DB:-packaging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-packaging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-packaging}"
    volumes:
      - product_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - product_media:/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  product_media:
